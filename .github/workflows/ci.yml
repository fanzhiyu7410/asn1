#
# 统一 CI 矩阵：每个平台只跑同一套核心步骤
#   cmake -S . -B build -> cmake --build build -> ctest
# 覆盖 Debug/Release 与共享/静态四种组合，全部开启 ASN1_WARNINGS_AS_ERRORS。
# 模块默认随 ASN1_BUILD_MODULES 构建；这里显式打开 asn1-pkcs 与 asn1-cms，
# 确保其用例进入全部 24 个组合，不依赖选项默认值。

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.build_type }}-${{ matrix.link_mode }}
    runs-on: ${{ matrix.os }}
    # 防止某个平台挂起把整次 run 拖成永不终结；超时按失败处理，不作为成功。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-gcc, linux-clang, macos-x86_64, macos-arm64, windows-msvc,
          windows-mingw]
        build_type: [Debug, Release]
        link_mode: [shared, static]
        # include 条目必须带上 platform，才能作为该平台的属性合并进对应组合；
        # 不带 platform 的条目会被叠加到同一组原始组合上并互相覆盖（矩阵塌缩）。
        include:
          - platform: linux-gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
            generator: Ninja
          - platform: linux-clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            generator: Ninja
          - platform: macos-x86_64
            os: macos-15-intel
            cc: clang
            cxx: clang++
            generator: Ninja
          - platform: macos-arm64
            os: macos-15
            cc: clang
            cxx: clang++
            generator: Ninja
          - platform: windows-msvc
            os: windows-2022
            cc: ""
            cxx: ""
            generator: ""
          - platform: windows-mingw
            os: windows-2022
            cc: gcc
            cxx: g++
            generator: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 工具链
        if: matrix.platform == 'linux-gcc' || matrix.platform == 'linux-clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.cc }}" = "gcc-13" ]; then
            sudo apt-get install -y gcc-13 g++-13
          fi

      - name: 安装 MinGW 工具链（MSYS2）
        if: matrix.platform == 'windows-mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
          path-type: inherit

      - name: 配置（Linux/macOS）
        if: matrix.platform != 'windows-msvc' && matrix.platform != 'windows-mingw'
        shell: bash
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DASN1_BUILD_TESTS=ON \
            -DASN1_BUILD_EXAMPLES=ON \
            -DASN1_WARNINGS_AS_ERRORS=ON \
            -DASN1_BUILD_MODULE_PKCS=ON \
            -DASN1_BUILD_MODULE_CMS=ON \
            -DASN1_BUILD_SHARED=${{ matrix.link_mode == 'shared' && 'ON' || 'OFF' }} \
            -DASN1_BUILD_STATIC=${{ matrix.link_mode == 'static' && 'ON' || 'OFF' }}

      - name: 配置（MinGW）
        if: matrix.platform == 'windows-mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DASN1_BUILD_TESTS=ON \
            -DASN1_BUILD_EXAMPLES=ON \
            -DASN1_WARNINGS_AS_ERRORS=ON \
            -DASN1_BUILD_MODULE_PKCS=ON \
            -DASN1_BUILD_MODULE_CMS=ON \
            -DASN1_BUILD_SHARED=${{ matrix.link_mode == 'shared' && 'ON' || 'OFF' }} \
            -DASN1_BUILD_STATIC=${{ matrix.link_mode == 'static' && 'ON' || 'OFF' }}

      - name: 配置（MSVC）
        if: matrix.platform == 'windows-msvc'
        shell: bash
        run: |
          cmake -S . -B build -A x64 \
            -DASN1_BUILD_TESTS=ON \
            -DASN1_BUILD_EXAMPLES=ON \
            -DASN1_WARNINGS_AS_ERRORS=ON \
            -DASN1_BUILD_MODULE_PKCS=ON \
            -DASN1_BUILD_MODULE_CMS=ON \
            -DASN1_BUILD_SHARED=${{ matrix.link_mode == 'shared' && 'ON' || 'OFF' }} \
            -DASN1_BUILD_STATIC=${{ matrix.link_mode == 'static' && 'ON' || 'OFF' }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: 构建（Linux/macOS）
        if: matrix.platform != 'windows-msvc' && matrix.platform != 'windows-mingw'
        shell: bash
        run: cmake --build build --parallel > build.log 2>&1

      - name: 构建日志（Linux/macOS）
        if: always() && matrix.platform != 'windows-msvc' && matrix.platform != 'windows-mingw'
        shell: bash
        run: |
          if [ -f build.log ]; then
            tail -n 120 build.log
            # 匿名访问无法下载 Actions 日志（REST 返回 403），把编译诊断行提升为
            # annotation，可通过 check-runs annotations 接口匿名取回；
            # annotation 只影响展示，不改变任何步骤或 job 的结论。
            # grep 无匹配时退出码为 1，而 GitHub 的 bash 默认 -e -o pipefail，
            # 故先落盘再逐行读出，避免“没匹配到”被当成步骤失败。
            grep -E 'error[: ]' build.log | head -n 20 | sed 's/%/%25/g' > diag.err.txt || true
            while IFS= read -r line; do echo "::error::$line"; done < diag.err.txt
            grep -E 'warning[: ]' build.log | head -n 20 | sed 's/%/%25/g' > diag.warn.txt || true
            while IFS= read -r line; do echo "::warning::$line"; done < diag.warn.txt
          fi

      - name: 构建（MinGW）
        if: matrix.platform == 'windows-mingw'
        shell: msys2 {0}
        run: cmake --build build --parallel > build.log 2>&1

      - name: 构建日志（MinGW）
        if: always() && matrix.platform == 'windows-mingw'
        shell: msys2 {0}
        run: |
          if [ -f build.log ]; then
            tail -n 120 build.log
            # 匿名访问无法下载 Actions 日志（REST 返回 403），把编译诊断行提升为
            # annotation，可通过 check-runs annotations 接口匿名取回；
            # annotation 只影响展示，不改变任何步骤或 job 的结论。
            # grep 无匹配时退出码为 1，而 GitHub 的 bash 默认 -e -o pipefail，
            # 故先落盘再逐行读出，避免“没匹配到”被当成步骤失败。
            grep -E 'error[: ]' build.log | head -n 20 | sed 's/%/%25/g' > diag.err.txt || true
            while IFS= read -r line; do echo "::error::$line"; done < diag.err.txt
            grep -E 'warning[: ]' build.log | head -n 20 | sed 's/%/%25/g' > diag.warn.txt || true
            while IFS= read -r line; do echo "::warning::$line"; done < diag.warn.txt
          fi

      - name: 构建（MSVC）
        if: matrix.platform == 'windows-msvc'
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }} --parallel > build.log 2>&1

      - name: 构建日志（MSVC）
        if: always() && matrix.platform == 'windows-msvc'
        shell: bash
        run: |
          if [ -f build.log ]; then
            tail -n 120 build.log
            # 匿名访问无法下载 Actions 日志（REST 返回 403），把编译诊断行提升为
            # annotation，可通过 check-runs annotations 接口匿名取回；
            # annotation 只影响展示，不改变任何步骤或 job 的结论。
            # grep 无匹配时退出码为 1，而 GitHub 的 bash 默认 -e -o pipefail，
            # 故先落盘再逐行读出，避免“没匹配到”被当成步骤失败。
            grep -E 'error[: ]' build.log | head -n 20 | sed 's/%/%25/g' > diag.err.txt || true
            while IFS= read -r line; do echo "::error::$line"; done < diag.err.txt
            grep -E 'warning[: ]' build.log | head -n 20 | sed 's/%/%25/g' > diag.warn.txt || true
            while IFS= read -r line; do echo "::warning::$line"; done < diag.warn.txt
          fi

      - name: 测试（Linux/macOS）
        if: matrix.platform != 'windows-msvc' && matrix.platform != 'windows-mingw'
        shell: bash
        run: ctest --test-dir build --output-on-failure

      - name: 测试（MinGW）
        if: matrix.platform == 'windows-mingw'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: 测试（MSVC）
        if: matrix.platform == 'windows-msvc'
        shell: bash
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  # 交叉编译只验证“能构建、能链接、产物尺寸”，不在 CI 内运行目标代码。
  freestanding-arm:
    name: linux-freestanding-arm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ARM 裸机工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: 配置（Cortex-M4F，静态 + freestanding）
        run: |
          cmake -S . -B build-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi-cortex-m4.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DASN1_BUILD_SHARED=OFF \
            -DASN1_BUILD_STATIC=ON \
            -DASN1_FREESTANDING=ON \
            -DASN1_BUILD_MODULES=OFF \
            -DASN1_BUILD_TOOLS=OFF \
            -DASN1_BUILD_EMBEDDED_TEST=ON \
            -DASN1_WARNINGS_AS_ERRORS=ON

      - name: 构建（只链接，不运行）
        run: cmake --build build-arm --parallel

      - name: 输出产物尺寸
        run: |
          arm-none-eabi-size build-arm/tests/embedded/test_embedded_pool
          ls -l build-arm/src/libasn1_static.a
